<svg xmlns="http://www.w3.org/2000/svg" width="880" height="281" viewBox="0 0 880 281" role="img" aria-label="support.me.at at a glance: Six ways to give, Never takes a payment, No goal, no thermometer, Free ways to help">
<rect x="0.5" y="0.5" width="879" height="280" rx="12" fill="#0a0a0a" stroke="#262626"/>
<rect x="24" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#404040" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="44" dy="0">Six ways to</tspan><tspan x="44" dy="22">give</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="44" dy="0">GitHub Sponsors, Open</tspan><tspan x="44" dy="21">Collective, Buy me a</tspan><tspan x="44" dy="21">coffee, Ko-fi,</tspan><tspan x="44" dy="21">Patreon and</tspan><tspan x="44" dy="21">Liberapay.</tspan></text>
<rect x="236" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#404040" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="256" dy="0">Never takes a</tspan><tspan x="256" dy="22">payment</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="256" dy="0">Every link opens the</tspan><tspan x="256" dy="21">platform's own site.</tspan><tspan x="256" dy="21">No checkout, no card</tspan><tspan x="256" dy="21">fields, no amounts</tspan><tspan x="256" dy="21">tracked.</tspan></text>
<rect x="448" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#404040" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="468" dy="0">No goal, no</tspan><tspan x="468" dy="22">thermometer</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="468" dy="0">No running total or</tspan><tspan x="468" dy="21">progress bar. Just</tspan><tspan x="468" dy="21">what the work is and</tspan><tspan x="468" dy="21">where support goes.</tspan></text>
<rect x="660" y="24" width="196" height="233" rx="10" fill="#171717" stroke="#262626"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#404040" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="680" dy="0">Free ways to</tspan><tspan x="680" dy="22">help</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="680" dy="0">Starring and</tspan><tspan x="680" dy="21">following the work on</tspan><tspan x="680" dy="21">GitHub, for anyone</tspan><tspan x="680" dy="21">who would rather not</tspan><tspan x="680" dy="21">give money.</tspan></text>
</svg>
